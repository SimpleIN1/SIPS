
upstream server-account-app {
    server 127.0.0.1:8000;
}

upstream server-auth-app {
    server 127.0.0.1:8001;
}

upstream server-info-composite-app {
    server 127.0.0.1:8002;
}

upstream server-composite-data-app {
    server 127.0.0.1:8003;
}

upstream server-docs-agregator-app {
    server 127.0.0.1:8004;
}

upstream server-alg-manager-app {
    server 127.0.0.1:8005;
}

server {
    listen ${SERVER_HTTP_PORT};
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root ${CERTBOT_PATH};
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen ${SERVER_HTTPS_PORT} ssl;
    server_name ${SERVER_NAME};

    http2 on;

    access_log /var/log/nginx/access-sips.log;
    error_log /var/log/nginx/error-sips.log;

    ssl_certificate     ${SSL_CERTIFICATE_PATH};
    ssl_certificate_key ${SSL_CERTIFICATE_KEY_PATH};
    ssl_session_timeout 10m;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_tickets off;
    ssl_session_cache shared:le_nginx_SSL:10m;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ~* ^/tiles/(?<filename>.+\.png)$ {
        alias "${TILES_PATH}/$filename";
    }

    location ~* ^/ru-regions-json/(?<filename>.+\.json)$ {
        expires 365d;
        alias "${RU_REGIONS_JSON_PATH}/$filename";
    }

    location ~* ^/static/(?<filename>.+\.(js|css|woff|svg|png))$ {
        expires 365d;
        alias "${STATIC_PATH}/$filename";
    }

    location ~* ^/files/(?<filename>.+\.webp) {
        expires 365d;
        alias "${FILES_PATH}/$filename";
    }

    proxy_set_header Origin $http_origin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Ssl $https;


    location /docs/swagger/ {
        proxy_redirect off;
        proxy_pass http://server-docs-agregator-app;
    }

    location /api/vauth/ {
        proxy_redirect off;
        proxy_pass http://server-auth-app;
    }

    location /api/vaccount/ {
        proxy_redirect off;
        proxy_pass http://server-account-app;
    }

    location /api/vicod/ {
        proxy_redirect off;
        proxy_pass http://server-info-composite-app;
    }

    location /api/vcd/ {
        proxy_redirect off;
        proxy_pass http://server-composite-data-app;
    }

    location / {
        root ${FRONTEND_BUILD_PATH};
        index index.html index.htm;
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${SERVER_ALG_MANAGER_HTTPS_PORT} ssl;
    server_name ${SERVER_NAME};

    http2 on;

    ssl_certificate     ${SSL_CERTIFICATE_PATH};
    ssl_certificate_key ${SSL_CERTIFICATE_KEY_PATH};
    ssl_session_timeout 10m;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_tickets off;
    ssl_session_cache shared:le_nginx_SSL:10m;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded_For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    add_header X-XSS-Protection "1; mode=block"; # turn on the filter and lock the page completely
    add_header X-Premitted-Cross-Domain-Policies master-only;

    location / {
        proxy_redirect off;
        proxy_pass http://server-alg-manager-app;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_pass http://server-alg-manager-app;
    }
}