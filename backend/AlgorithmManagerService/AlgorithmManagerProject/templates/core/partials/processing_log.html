{% if log_error %}
<div class="p-8 text-center text-gray-500">
    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <p class="mt-2">{{ log_error }}</p>
</div>
{% elif log_lines %}
<div class="log-container">
    {% for log_line in log_lines %}
    <div class="log-line {{ log_line.class }}">{{ log_line.text }}</div>
    {% endfor %}
</div>
{% else %}
<div class="p-8 text-center text-gray-500">
    <svg class="mx-auto h-12 w-12 text-gray-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <p class="mt-2">Логи пока пусты. Ожидание выполнения...</p>
</div>
{% endif %}
