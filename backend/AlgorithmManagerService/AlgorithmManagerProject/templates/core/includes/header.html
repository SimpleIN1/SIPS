
<nav class="bg-gradient-to-r from-blue-600 to-blue-700 shadow-lg" x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex-shrink-0">
                <a href="{% url 'core:dashboard' %}" class="flex items-center space-x-2 text-white font-bold text-xl">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                    </svg>
                    <span>AlgorithmManager</span>
                </a>
            </div>

            <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                    <a href="{% url 'core:dashboard' %}"
                       class="text-white hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out flex items-center space-x-1 {% if request.resolver_match.url_name == 'dashboard' %}bg-blue-800{% endif %}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="{% url 'core:algorithms_list' %}"
                       class="text-white hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out flex items-center space-x-1 {% if request.resolver_match.url_name == 'algorithms_list' %}bg-blue-800{% endif %}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <span>Алгоритмы</span>
                    </a>
                    <a href="{% url 'core:files_list' %}"
                       class="text-white hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out flex items-center space-x-1 {% if request.resolver_match.url_name == 'files_list' %}bg-blue-800{% endif %}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <span>Файлы</span>
                    </a>
                    <a href="{% url 'core:processing_list' %}"
                       class="text-white hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out flex items-center space-x-1 {% if request.resolver_match.url_name == 'processing_list' %}bg-blue-800{% endif %}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Запуски</span>
                    </a>
                </div>
            </div>

            <div class="hidden md:block">
                <div class="ml-4 flex items-center md:ml-6" x-data="{ userMenuOpen: false }">
                    {% if user.is_authenticated %}
                    <div class="relative">
                        <button @click="userMenuOpen = !userMenuOpen"
                                class="flex items-center space-x-2 text-white hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span>{{ user.username }}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>

                        <div x-show="userMenuOpen"
                             @click.away="userMenuOpen = false"
                             class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 ring-1 ring-black ring-opacity-5"
                             style="display: none;">
                            <a href="{% url 'core:profile' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Профиль</a>
                            <hr class="my-1">
                            <a href="{% url 'core:logout' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Выход</a>
                        </div>
                    </div>
                    {% else %}
                    <a href="{% url 'core:login' %}"
                       class="text-white hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-150 ease-in-out flex items-center space-x-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        <span>Вход</span>
                    </a>
                    {% endif %}
                </div>
            </div>

            <div class="-mr-2 flex md:hidden">
                <button @click="mobileMenuOpen = !mobileMenuOpen"
                        type="button"
                        class="inline-flex items-center justify-center p-2 rounded-md text-white hover:bg-blue-500 focus:outline-none"
                        aria-controls="mobile-menu" aria-expanded="false">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div x-show="mobileMenuOpen"
         @click.away="mobileMenuOpen = false"
         class="md:hidden bg-blue-700"
         id="mobile-menu"
         style="display: none;">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a href="{% url 'core:dashboard' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Dashboard</a>
            <a href="{% url 'core:algorithms_list' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Алгоритмы</a>
            <a href="{% url 'core:files_list' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Файлы</a>
            <a href="{% url 'core:processing_list' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Запуски</a>
            {% if user.is_authenticated %}
            <a href="{% url 'core:profile' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Профиль</a>
            <a href="{% url 'core:logout' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Выход</a>
            {% else %}
            <a href="{% url 'core:login' %}" class="text-white hover:bg-blue-500 block px-3 py-2 rounded-md text-base font-medium">Вход</a>
            {% endif %}
        </div>
    </div>
</nav>
